name: Diagnóstico API SiAR

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-latest

    steps:
      - name: Diagnosticar acceso SiAR
        env:
          SIAR_TOKEN: ${{ secrets.SIAR_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse
          import urllib.error
          from datetime import datetime
          from zoneinfo import ZoneInfo

          BASE = "https://servicio.mapa.gob.es/siarapi"
          TOKEN = os.environ["SIAR_TOKEN"]

          def pedir(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0 Meteogramas-MetVlc/1.0",
                      "Accept": "application/json"
                  }
              )

              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      raw = r.read()
                      print("HTTP:", r.status)

                      for enc in ("utf-8-sig", "cp1252", "latin-1"):
                          try:
                              return json.loads(raw.decode(enc))
                          except:
                              pass

                      print(raw[:1000])
                      return None

              except urllib.error.HTTPError as e:
                  print("HTTP ERROR:", e.code)
                  print("Motivo:", e.reason)

                  cuerpo = e.read()

                  try:
                      texto = cuerpo.decode("utf-8", errors="replace")
                  except:
                      texto = str(cuerpo)

                  # Por seguridad, ocultamos el token si apareciera
                  texto = texto.replace(TOKEN, "***TOKEN_OCULTO***")

                  print("Respuesta del servidor:")
                  print(texto[:3000])

                  return None

          # --------------------------------------------------
          # 1. Comprobar límites del token
          # --------------------------------------------------

          print("=== ACCESOS DEL TOKEN ===")

          url_accesos = (
              f"{BASE}/API/V1/Info/ACCESOS?"
              + urllib.parse.urlencode({"token": TOKEN})
          )

          accesos = pedir(url_accesos)

          if accesos:
              print(json.dumps(accesos, indent=2, ensure_ascii=False))

          # --------------------------------------------------
          # 2. Probar datos horarios
          # --------------------------------------------------

          hoy = datetime.now(
              ZoneInfo("Europe/Madrid")
          ).strftime("%Y-%m-%d")

          print()
          print("=== DATOS HORARIOS VALENCIA ===")
          print("Fecha:", hoy)

          params = {
              "token": TOKEN,
              "Id": "V",
              "FechaInicial": hoy,
              "FechaFinal": hoy
          }

          url_datos = (
              f"{BASE}/API/V1/Datos/Horarios/PROVINCIA?"
              + urllib.parse.urlencode(params)
          )

          datos = pedir(url_datos)

          if datos:
              registros = datos.get("datos", [])

              print()
              print("Registros recibidos:", len(registros))
              print("Mensaje:", datos.get("MensajeRespuesta"))

          PY
