name: Probar datos horarios SiAR

on:
  workflow_dispatch:

jobs:
  probar:
    runs-on: ubuntu-latest

    steps:
      - name: Consultar observaciones de Valencia
        env:
          SIAR_TOKEN: ${{ secrets.SIAR_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo

          BASE = "https://servicio.mapa.gob.es/siarapi"
          TOKEN = os.environ["SIAR_TOKEN"]

          hoy = datetime.now(ZoneInfo("Europe/Madrid")).strftime("%Y-%m-%d")

          parametros = {
              "token": TOKEN,
              "Id": "V",
              "FechaInicial": hoy,
              "FechaFinal": hoy
          }

          url = (
              f"{BASE}/API/V1/Datos/Horarios/PROVINCIA?"
              + urllib.parse.urlencode(parametros)
          )

          print(f"Consultando datos SiAR de Valencia para {hoy}")
          print()

          with urllib.request.urlopen(url, timeout=60) as r:
              raw = r.read()

          datos = None

          for codificacion in ("utf-8-sig", "cp1252", "latin-1"):
              try:
                  datos = json.loads(raw.decode(codificacion))
                  break
              except (UnicodeDecodeError, json.JSONDecodeError):
                  continue

          if datos is None:
              raise RuntimeError("No se pudo interpretar la respuesta de SiAR")

          print("Mensaje SiAR:")
          print(datos.get("MensajeRespuesta"))
          print()

          registros = datos.get("datos", [])

          print(f"Registros horarios recibidos: {len(registros)}")
          print()

          if not registros:
              print("No se han recibido registros.")
              print(datos)
              raise SystemExit(0)

          # Nos quedamos con la observación más reciente de cada estación
          ultimos = {}

          def clave_hora(registro):
              fecha = str(registro.get("Fecha", ""))
              hora = str(registro.get("HorMin", 0)).zfill(4)
              return fecha, hora

          for r in registros:
              estacion = str(r.get("Estacion", ""))

              if not estacion:
                  continue

              if (
                  estacion not in ultimos
                  or clave_hora(r) > clave_hora(ultimos[estacion])
              ):
                  ultimos[estacion] = r

          print(f"Estaciones con datos hoy: {len(ultimos)}")
          print()
          print("=== ÚLTIMA OBSERVACIÓN DE CADA ESTACIÓN ===")
          print()

          for codigo in sorted(ultimos):
              r = ultimos[codigo]

              print(
                  f'{codigo} | '
                  f'{r.get("Fecha")} {str(r.get("HorMin", "")).zfill(4)} | '
                  f'T={r.get("TempMedia")} °C | '
                  f'HR={r.get("HumedadMedia")} % | '
                  f'V={r.get("VelViento")} | '
                  f'Dir={r.get("DirViento")}° | '
                  f'P={r.get("Precipitacion")} mm'
              )
          PY
