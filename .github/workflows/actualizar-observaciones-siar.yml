name: Actualizar observaciones SiAR

on:
  schedule:
    - cron: '5 10-22/2 * * *'
      timezone: 'Europe/Madrid'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Descargar observaciones SiAR
        env:
          SIAR_TOKEN: ${{ secrets.SIAR_TOKEN }}
        run: python scripts/actualizar_observaciones_siar.py

      - name: Publicar JSON actualizado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add datos/observaciones_siar.json

          if git diff --cached --quiet; then
            echo "Sin cambios en las observaciones SiAR"
            exit 0
          fi

          git commit -m "Actualizar observaciones SiAR"
          git push
