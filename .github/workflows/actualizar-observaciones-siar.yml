import json
import math
import os
import urllib.error
import urllib.parse
import urllib.request

from datetime import datetime, timedelta
from pathlib import Path
from zoneinfo import ZoneInfo


# ============================================================
# CONFIGURACIÓN
# ============================================================

BASE_URL = "https://servicio.mapa.gob.es/siarapi"

TOKEN = os.environ.get("SIAR_TOKEN")

if not TOKEN:
    raise RuntimeError(
        "No se ha encontrado SIAR_TOKEN en las variables de entorno."
    )

PROVINCIA_CODIGO = "V"
PROVINCIA_NOMBRE = "Valencia/València"

TIMEZONE = ZoneInfo("Europe/Madrid")

ARCHIVO_SALIDA = Path("datos/observaciones_siar.json")


# ============================================================
# PETICIONES A LA API
# ============================================================

def descargar_json(url):
    """
    Realiza una petición HTTP a SiAR y devuelve el JSON.
    Incluye las cabeceras que han funcionado correctamente
    en GitHub Actions.
    """

    solicitud = urllib.request.Request(
        url,
        headers={
            "User-Agent": "Mozilla/5.0 Meteogramas-MetVlc/1.0",
            "Accept": "application/json"
        }
    )

    try:
        with urllib.request.urlopen(
            solicitud,
            timeout=60
        ) as respuesta:
            raw = respuesta.read()

    except urllib.error.HTTPError as error:
        cuerpo = error.read().decode(
            "utf-8",
            errors="replace"
        )

        # Seguridad: nunca mostrar el token en los logs
        cuerpo = cuerpo.replace(
            TOKEN,
            "***TOKEN_OCULTO***"
        )

        raise RuntimeError(
            f"Error HTTP SiAR {error.code}: {cuerpo[:1500]}"
        )

    except urllib.error.URLError as error:
        raise RuntimeError(
            f"Error de conexión con la API SiAR: {error}"
        )

    # SiAR puede devolver distintas codificaciones
    for codificacion in (
        "utf-8-sig",
        "utf-8",
        "cp1252",
        "latin-1"
    ):
        try:
            texto = raw.decode(codificacion)
            return json.loads(texto)

        except (
            UnicodeDecodeError,
            json.JSONDecodeError
        ):
            continue

    raise RuntimeError(
        "No se ha podido interpretar la respuesta JSON de SiAR."
    )


# ============================================================
# SERVICIO INFO
# ============================================================

def consultar_info(tipo):
    parametros = urllib.parse.urlencode({
        "token": TOKEN
    })

    url = (
        f"{BASE_URL}/API/V1/Info/"
        f"{tipo}?{parametros}"
    )

    return descargar_json(url)


# ============================================================
# CONSULTA DE DATOS HORARIOS
# ============================================================

def consultar_horarios_valencia(fecha):
    """
    Consulta todos los registros horarios de la provincia
    de Valencia para una fecha concreta.
    """

    parametros = urllib.parse.urlencode({
        "token": TOKEN,
        "Id": PROVINCIA_CODIGO,
        "FechaInicial": fecha,
        "FechaFinal": fecha
    })

    url = (
        f"{BASE_URL}/API/V1/Datos/"
        f"Horarios/PROVINCIA?"
        f"{parametros}"
    )

    return descargar_json(url)


# ============================================================
# FUNCIONES AUXILIARES
# ============================================================

def a_float(valor):
    if valor is None:
        return None

    try:
        if isinstance(valor, str):
            valor = valor.strip()

            if not valor:
                return None

            valor = valor.replace(",", ".")

        return float(valor)

    except (ValueError, TypeError):
        return None


def normalizar_hora(valor):
    """
    Convierte:
        930  -> 0930
        1830 -> 1830
    """

    if valor is None:
        return None

    try:
        numero = int(float(valor))
        return str(numero).zfill(4)

    except (ValueError, TypeError):
        texto = str(valor).strip()
        return texto.zfill(4) if texto else None


def normalizar_fecha(valor):
    if valor is None:
        return None

    texto = str(valor).strip()

    if len(texto) >= 10:
        return texto[:10]

    return texto


def clave_temporal(registro):
    fecha = normalizar_fecha(
        registro.get("Fecha")
    ) or ""

    hora = normalizar_hora(
        registro.get("HorMin")
    ) or "0000"

    return fecha, hora


# ============================================================
# COORDENADAS SIAR
# ============================================================

def dms_a_decimal(valor):
    """
    Convierte las coordenadas DMS proporcionadas por SiAR
    a grados decimales.

    Para las estaciones valencianas encontramos formatos como:

        391520000N
        015512000W

    que representan grados, minutos, segundos y milésimas
    de segundo.
    """

    if valor is None:
        return None

    texto = str(valor).strip().upper()

    if len(texto) < 7:
        return None

    hemisferio = texto[-1]
    numeros = texto[:-1]

    try:
        # Para Valencia tanto latitud como longitud
        # utilizan dos posiciones para los grados.
        grados = int(numeros[:2])
        minutos = int(numeros[2:4])

        resto = numeros[4:]

        if resto:
            segundos = float(resto) / 1000.0
        else:
            segundos = 0.0

        decimal = (
            grados
            + minutos / 60.0
            + segundos / 3600.0
        )

        if hemisferio in ("S", "W"):
            decimal *= -1

        return round(decimal, 6)

    except (ValueError, TypeError):
        return None


# ============================================================
# PUNTO DE ROCÍO
# ============================================================

def calcular_punto_rocio(temperatura, humedad):
    """
    Punto de rocío mediante aproximación de Magnus.
    """

    temperatura = a_float(temperatura)
    humedad = a_float(humedad)

    if temperatura is None or humedad is None:
        return None

    if humedad <= 0 or humedad > 100:
        return None

    a = 17.625
    b = 243.04

    gamma = (
        math.log(humedad / 100.0)
        + (
            a * temperatura
            / (b + temperatura)
        )
    )

    punto_rocio = (
        b * gamma
        / (a - gamma)
    )

    return round(
        punto_rocio,
        1
    )


# ============================================================
# DÉFICIT DE PRESIÓN DE VAPOR
# ============================================================

def calcular_dpv(temperatura, humedad):
    """
    Calcula DPV en kPa.
    """

    temperatura = a_float(temperatura)
    humedad = a_float(humedad)

    if temperatura is None or humedad is None:
        return None

    if humedad < 0 or humedad > 100:
        return None

    presion_saturacion = (
        0.6108
        * math.exp(
            (17.27 * temperatura)
            / (temperatura + 237.3)
        )
    )

    presion_real = (
        presion_saturacion
        * humedad
        / 100.0
    )

    dpv = (
        presion_saturacion
        - presion_real
    )

    return round(
        dpv,
        2
    )


# ============================================================
# ESTACIONES ACTIVAS DE VALENCIA
# ============================================================

def obtener_estaciones_valencia():
    print(
        "Descargando información de estaciones SiAR..."
    )

    respuesta = consultar_info(
        "ESTACIONES"
    )

    datos = respuesta.get(
        "datos",
        []
    )

    estaciones = {}

    for estacion in datos:
        codigo = str(
            estacion.get(
                "Codigo",
                ""
            )
        ).strip().upper()

        if not codigo:
            continue

        # Estaciones valencianas:
        # V02, V04, V19, V101...
        if not codigo.startswith("V"):
            continue

        # Excluir estaciones dadas de baja
        if estacion.get("Fecha_Baja"):
            continue

        estaciones[codigo] = estacion

    print(
        f"Estaciones activas identificadas: "
        f"{len(estaciones)}"
    )

    return estaciones


# ============================================================
# ÚLTIMA OBSERVACIÓN POR ESTACIÓN
# ============================================================

def obtener_ultimos_registros(registros):
    ultimos = {}

    for registro in registros:
        codigo = str(
            registro.get(
                "Estacion",
                ""
            )
        ).strip().upper()

        if not codigo:
            continue

        if not codigo.startswith("V"):
            continue

        if codigo not in ultimos:
            ultimos[codigo] = registro
            continue

        if (
            clave_temporal(registro)
            >
            clave_temporal(
                ultimos[codigo]
            )
        ):
            ultimos[codigo] = registro

    return ultimos


# ============================================================
# GENERAR FECHA/HORA ISO
# ============================================================

def generar_fecha_hora_iso(fecha, hora):
    fecha = normalizar_fecha(fecha)
    hora = normalizar_hora(hora)

    if not fecha or not hora:
        return None

    try:
        fecha_hora = datetime.strptime(
            f"{fecha} {hora}",
            "%Y-%m-%d %H%M"
        )

        fecha_hora = fecha_hora.replace(
            tzinfo=TIMEZONE
        )

        return fecha_hora.isoformat()

    except ValueError:
        return None


# ============================================================
# PROGRAMA PRINCIPAL
# ============================================================

def main():
    ahora = datetime.now(
        TIMEZONE
    )

    hoy = ahora.strftime(
        "%Y-%m-%d"
    )

    print()
    print(
        "=============================================="
    )

    print(
        " ACTUALIZACIÓN DE OBSERVACIONES SIAR - METVLC"
    )

    print(
        "=============================================="
    )

    print()

    # --------------------------------------------------------
    # ESTACIONES
    # --------------------------------------------------------

    estaciones = (
        obtener_estaciones_valencia()
    )

    print()

    # --------------------------------------------------------
    # DATOS HORARIOS
    # --------------------------------------------------------

    print(
        f"Descargando observaciones SiAR para {hoy}..."
    )

    respuesta = (
        consultar_horarios_valencia(
            hoy
        )
    )

    registros = respuesta.get(
        "datos",
        []
    )

    print(
        f"Registros recibidos: "
        f"{len(registros)}"
    )

    fecha_consultada = hoy

    # --------------------------------------------------------
    # A primera hora puede que aún no exista ningún registro.
    # En ese caso utilizamos el día anterior.
    # --------------------------------------------------------

    if not registros:
        ayer = (
            ahora
            - timedelta(days=1)
        ).strftime("%Y-%m-%d")

        print()
        print(
            "No existen registros de hoy todavía."
        )

        print(
            f"Consultando el día anterior: {ayer}"
        )

        respuesta = (
            consultar_horarios_valencia(
                ayer
            )
        )

        registros = respuesta.get(
            "datos",
            []
        )

        fecha_consultada = ayer

        print(
            f"Registros recibidos: "
            f"{len(registros)}"
        )

    if not registros:
        raise RuntimeError(
            "SiAR no ha devuelto ningún registro horario."
        )

    # --------------------------------------------------------
    # SELECCIONAR SOLO EL ÚLTIMO REGISTRO DE CADA ESTACIÓN
    # --------------------------------------------------------

    ultimos = (
        obtener_ultimos_registros(
            registros
        )
    )

    print(
        f"Estaciones con observación: "
        f"{len(ultimos)}"
    )

    print()

    resultado = []

    # --------------------------------------------------------
    # CONSTRUIR JSON
    # --------------------------------------------------------

    for codigo, observacion in ultimos.items():
        metadata = estaciones.get(
            codigo,
            {}
        )

        temperatura = a_float(
            observacion.get(
                "TempMedia"
            )
        )

        humedad = a_float(
            observacion.get(
                "HumedadMedia"
            )
        )

        viento = a_float(
            observacion.get(
                "VelViento"
            )
        )

        direccion = a_float(
            observacion.get(
                "DirViento"
            )
        )

        precipitacion = a_float(
            observacion.get(
                "Precipitacion"
            )
        )

        radiacion = a_float(
            observacion.get(
                "Radiacion"
            )
        )

        temperatura_suelo_1 = a_float(
            observacion.get(
                "TempSuelo1"
            )
        )

        temperatura_suelo_2 = a_float(
            observacion.get(
                "TempSuelo2"
            )
        )

        fecha = normalizar_fecha(
            observacion.get(
                "Fecha"
            )
        )

        hora = normalizar_hora(
            observacion.get(
                "HorMin"
            )
        )

        estacion_json = {
            "red": "SIAR",

            "fuente": (
                "SiAR - Ministerio de Agricultura, "
                "Pesca y Alimentación"
            ),

            "codigo": codigo,

            "nombre": metadata.get(
                "Estacion"
            ),

            "municipio": metadata.get(
                "Termino"
            ),

            "latitud": dms_a_decimal(
                metadata.get(
                    "Latitud"
                )
            ),

            "longitud": dms_a_decimal(
                metadata.get(
                    "Longitud"
                )
            ),

            "altitud": metadata.get(
                "Altitud"
            ),

            "fecha": fecha,

            "hora": hora,

            "fecha_hora": (
                generar_fecha_hora_iso(
                    fecha,
                    hora
                )
            ),

            "temperatura": temperatura,

            "humedad": humedad,

            "punto_rocio": (
                calcular_punto_rocio(
                    temperatura,
                    humedad
                )
            ),

            "dpv": calcular_dpv(
                temperatura,
                humedad
            ),

            "viento": viento,

            "direccion_viento": direccion,

            "precipitacion": precipitacion,

            "radiacion": radiacion,

            "temperatura_suelo_1": (
                temperatura_suelo_1
            ),

            "temperatura_suelo_2": (
                temperatura_suelo_2
            )
        }

        resultado.append(
            estacion_json
        )

    # Ordenar:
    # V02, V04, V05, etc.
    resultado.sort(
        key=lambda estacion: (
            estacion.get(
                "codigo"
            ) or ""
        )
    )

    # --------------------------------------------------------
    # JSON FINAL
    # --------------------------------------------------------

    salida = {
        "fuente": "SiAR - MAPA",

        "red": "SIAR",

        "tipo": (
            "observaciones_horarias"
        ),

        "provincia": (
            PROVINCIA_NOMBRE
        ),

        "codigo_provincia": (
            PROVINCIA_CODIGO
        ),

        "fecha_consultada": (
            fecha_consultada
        ),

        "actualizado": (
            ahora.isoformat()
        ),

        "numero_estaciones": (
            len(resultado)
        ),

        "estaciones": (
            resultado
        )
    }

    # --------------------------------------------------------
    # GUARDAR ARCHIVO
    # --------------------------------------------------------

    ARCHIVO_SALIDA.parent.mkdir(
        parents=True,
        exist_ok=True
    )

    with open(
        ARCHIVO_SALIDA,
        "w",
        encoding="utf-8"
    ) as archivo:
        json.dump(
            salida,
            archivo,
            ensure_ascii=False,
            indent=2
        )

    # --------------------------------------------------------
    # RESUMEN
    # --------------------------------------------------------

    print(
        "=============================================="
    )

    print(
        " OBSERVACIONES SIAR ACTUALIZADAS CORRECTAMENTE"
    )

    print(
        "=============================================="
    )

    print()

    print(
        f"Archivo generado: "
        f"{ARCHIVO_SALIDA}"
    )

    print(
        f"Estaciones disponibles: "
        f"{len(resultado)}"
    )

    print()

    print(
        "Última observación disponible por estación:"
    )

    print()

    for estacion in resultado:
        print(
            f'{estacion["codigo"]} | '
            f'{estacion["nombre"]} | '
            f'{estacion["hora"]} | '
            f'T={estacion["temperatura"]} °C | '
            f'HR={estacion["humedad"]} % | '
            f'Td={estacion["punto_rocio"]} °C | '
            f'DPV={estacion["dpv"]} kPa | '
            f'Viento={estacion["viento"]}'
        )

    print()

    print(
        "Proceso finalizado correctamente."
    )


# ============================================================
# EJECUCIÓN
# ============================================================

if __name__ == "__main__":
    main()
