name: Probar API SiAR

on:
  workflow_dispatch:

jobs:
  probar:
    runs-on: ubuntu-latest

    steps:
      - name: Probar conexión con SiAR
        env:
          SIAR_TOKEN: ${{ secrets.SIAR_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          import unicodedata

          BASE = "https://servicio.mapa.gob.es/siarapi"
          TOKEN = os.environ["SIAR_TOKEN"]

          def normalizar(texto):
              texto = str(texto or "").lower()
              texto = unicodedata.normalize("NFD", texto)
              return "".join(
                  c for c in texto
                  if unicodedata.category(c) != "Mn"
              )

          def consultar(ruta):
              separador = "&" if "?" in ruta else "?"
              url = (
                  f"{BASE}{ruta}{separador}"
                  + urllib.parse.urlencode({"token": TOKEN})
              )

              with urllib.request.urlopen(url, timeout=30) as r:
                  raw = r.read()

              for codificacion in ("utf-8-sig", "cp1252", "latin-1"):
                  try:
                      return json.loads(raw.decode(codificacion))
                  except (UnicodeDecodeError, json.JSONDecodeError):
                      continue

              raise RuntimeError("No se pudo decodificar la respuesta de SiAR")

          # 1. Provincias
          provincias = consultar("/API/V1/Info/PROVINCIAS")

          valencia = None

          for p in provincias.get("datos", []):
              if "valen" in normalizar(p.get("Provincia")):
                  valencia = p
                  break

          if not valencia:
              raise SystemExit("No se ha encontrado Valencia/València")

          codigo_provincia = valencia["Codigo"]

          print("=== PROVINCIA ===")
          print(valencia)
          print()
          print(f"Código SiAR de Valencia: {codigo_provincia}")

          # 2. Todas las estaciones
          estaciones = consultar("/API/V1/Info/ESTACIONES")

          # Los códigos valencianos de SiAR comienzan por V
          estaciones_valencia = []

          for e in estaciones.get("datos", []):
              codigo = str(e.get("Codigo", "")).upper()

              if (
                  codigo.startswith("V")
                  and not e.get("Fecha_Baja")
              ):
                  estaciones_valencia.append(e)

          estaciones_valencia.sort(
              key=lambda x: str(x.get("Codigo", ""))
          )

          print()
          print(
              f"Estaciones activas candidatas de Valencia: "
              f"{len(estaciones_valencia)}"
          )
          print()

          for e in estaciones_valencia:
              print(
                  f'{e.get("Codigo")} - '
                  f'{e.get("Estacion")} | '
                  f'{e.get("Termino")} | '
                  f'{e.get("Altitud")} m'
              )
          PY
